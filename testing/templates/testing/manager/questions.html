{% extends 'base.html' %}
{% block title %}
<title>Вопросы теста</title>
{% endblock %}

{% block content %}
<style>
    h1 {
        color: #1A206A;
        font-size: 24px;
        margin-bottom: 20px;
    }

    .btn {
        display: inline-block;
        background: #1A206A;
        color: white;
        padding: 8px 15px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 14px;
        margin-right: 10px;
        margin-bottom: 10px;
    }

    .btn:hover {
        background: #2a3080;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    th, td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        text-align: left;
    }

    th {
        background: #1A206A;
        color: white;
    }

    tr:hover {
        background: #f5f5f5;
    }

    a {
        color: #1A206A;
        text-decoration: none;
    }

    a:not(.btn):hover {
        text-decoration: underline;
    }

    @media (max-width: 600px) {
        th, td {
            padding: 8px;
            font-size: 12px;
        }

        h1 {
            font-size: 20px;
        }

        .btn {
            padding: 6px 12px;
            font-size: 12px;
        }
    }
</style>
    <h1>Вопросы теста: {{ test.name }}</h1>
    <a href="/manager/tests/{{ test.id }}/questions/create/" class="btn">+ Добавить вопрос</a>
    <a href="/manager/tests/">← Назад</a>
    <table style="margin-top: 20px;">
        <thead>
            <tr><th>ID</th><th>Текст вопроса</th><th>Действия</th></tr>
        </thead>
        <tbody>
            {% for q in questions %}
            <tr>
                <td>{{ q.id }}</td>
                <td>{{ q.text }}</td>
                <td>
                    <a href="/manager/questions/{{ q.id }}/answers/" class="btn">Ответы</a>
                    <a href="/manager/questions/{{ q.id }}/edit/" class="btn">Изменить</a>
                    <a href="/manager/questions/{{ q.id }}/delete/" class="btn" style="background:#dc3545;" onclick="return confirm('Удалить вопрос?')">Удалить</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
